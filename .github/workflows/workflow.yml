name: workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image with Maven dependencies
        run: docker build -t yookassa:latest .

  test:
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - name: Run tests inside built Docker image
        run: |
          docker run --rm \
            -e SHOP_ID="${{ secrets.SHOP_ID }}" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            yookassa:latest \
            sh -c "mvn test"

  deploy:
    needs: test
    runs-on: self-hosted
    environment: production
    steps:
      - name: Stop old container if exists
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Eq '^yookassa'; then
            docker stop yookassa
            docker rm yookassa
          fi

      - name: Run new container
        run: |
          docker run -d \
            --name yookassa \
            --restart unless-stopped \
            -e SHOP_ID="${{ secrets.SHOP_ID }}" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -p 8080:8080 \
            yookassa:latest

      - name: Check container logs
        run: docker logs yookassa --tail 50

      - name: Remove unused Docker images
        run: docker image prune -f
