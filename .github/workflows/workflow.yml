name: workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Run tests inside Docker
        run: |
          mkdir -p ${{ github.workspace }}/.m2
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}/.m2:/app/.m2 \
            -w /app \
            -e SHOP_ID="${{ secrets.SHOP_ID }}" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            maven:3.9.9-amazoncorretto-21 \
            mvn clean test -Dmaven.repo.local=/app/.m2/repository

  build:
    needs: test
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yookassa:latest .

  deploy:
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - name: Stop old container if exists
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Eq '^yookassa'; then
            docker stop yookassa
            docker rm yookassa
          fi

      - name: Run new container
        run: |
          docker run -d \
            --name yookassa \
            --restart unless-stopped \
            -e SHOP_ID="${{ secrets.SHOP_ID }}" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -p 8080:8080 \
            yookassa:latest

      - name: Check container logs
        run: docker logs yookassa --tail 50

      - name: Remove unused Docker images
        run: |
          docker image prune -f
